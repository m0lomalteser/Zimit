name: Zimit Web Crawls

on:
  workflow_dispatch: # Erlaubt das manuelle Starten des Crawls über den GitHub-Tab

jobs:
  crawl-apple:
    name: Crawl Apple Developer Docs
    runs-on: ubuntu-latest
    timeout-minutes: 360 # 6 Stunden Zeitlimit

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Output-Verzeichnis erstellen
        run: mkdir -p output

      - name: Zimit Docker Container starten (Apple)
        run: |
          docker run --rm \
            --shm-size=2gb \
            -v "${{ github.workspace }}/output:/output" \
            ghcr.io/openzim/zimit \
            zimit \
            --seeds "https://developer.apple.com/documentation" \
            --name "apple-developer-docs" \
            --title "Apple Developer Documentation" \
            --workers 4 \
            --waitUntil domcontentloaded \
            --output /output

      - name: Apple ZIM Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: apple-developer-docs-zim
          path: output/*.zim

  crawl-wikihow:
    name: Crawl German wikiHow
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Output-Verzeichnis erstellen
        run: mkdir -p output

      - name: Zimit Docker Container starten (wikiHow)
        run: |
          docker run --rm \
            --shm-size=2gb \
            -v "${{ github.workspace }}/output:/output" \
            ghcr.io/openzim/zimit \
            zimit \
            --seeds "https://de.wikihow.org" \
            --name "de-wikihow" \
            --title "German wikiHow" \
            --workers 4 \
            --waitUntil domcontentloaded \
            --output /output

      - name: wikiHow ZIM Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: de-wikihow-zim
          path: output/*.zim
